# API Descriptions - Category
api.category.description=Request DTO for creating or updating a category
api.category.response.description=Response DTO containing category information
api.category.id.description=Unique identifier of the category
api.category.name.description=Category name
api.category.description.description=Category description
api.category.controller.tag=Category Management
api.category.controller.tag.description=APIs for managing product categories. Categories are cached in Redis with a 30-minute TTL for improved performance.

# API Descriptions - Category Operations
api.category.get.all.summary=Get all categories
api.category.get.all.description=Retrieves a list of all active (non-deleted) categories. Results are cached in Redis for 30 minutes to improve performance. The cache is automatically invalidated when categories are created, updated, or deleted.
api.category.get.all.success=Successfully retrieved list of categories

api.category.get.by.id.summary=Get category by ID
api.category.get.by.id.description=Retrieves a specific category by its unique identifier. Only active (non-deleted) categories can be retrieved. Results are cached in Redis for 30 minutes.
api.category.get.by.id.success=Category found and returned successfully
api.category.get.by.id.not.found=Category not found or has been deleted
api.category.get.by.id.param.id=Unique identifier of the category

api.category.create.summary=Create a new category
api.category.create.description=Creates a new product category. The category name must be unique among active categories. This operation automatically clears the category cache to ensure fresh data on next retrieval.
api.category.create.success=Category created successfully
api.category.create.bad.request=Invalid request data or category name already exists
api.category.create.param.request=Category creation request
api.category.create.param.user.id=ID of the user creating the category (optional, defaults to 1)

api.category.update.summary=Update an existing category
api.category.update.description=Updates an existing active category. The category name must be unique among active categories (excluding the current category). This operation automatically clears the category cache.
api.category.update.success=Category updated successfully
api.category.update.bad.request=Invalid request data or category name already exists
api.category.update.not.found=Category not found or has been deleted
api.category.update.param.id=Unique identifier of the category to update
api.category.update.param.request=Category update request
api.category.update.param.user.id=ID of the user updating the category (optional, defaults to 1)

api.category.delete.summary=Soft delete a category
api.category.delete.description=Performs a soft delete on a category by setting the deletedAt timestamp. The category is not permanently removed from the database and can be restored later. This operation automatically clears the category cache.
api.category.delete.success=Category soft deleted successfully
api.category.delete.not.found=Category not found or already deleted
api.category.delete.param.id=Unique identifier of the category to delete
api.category.delete.param.user.id=ID of the user deleting the category (optional, defaults to 1)

api.category.hard.delete.summary=Hard delete a category
api.category.hard.delete.description=Permanently deletes a category from the database. This operation cannot be undone. Use soft delete if you want the option to restore the category later. This operation automatically clears the category cache.
api.category.hard.delete.success=Category permanently deleted successfully
api.category.hard.delete.not.found=Category not found
api.category.hard.delete.param.id=Unique identifier of the category to permanently delete

api.category.restore.summary=Restore a deleted category
api.category.restore.description=Restores a soft-deleted category by clearing the deletedAt timestamp. The category name must be unique among active categories. If an active category with the same name exists, the restore operation will fail. This operation automatically clears the category cache.
api.category.restore.success=Category restored successfully
api.category.restore.bad.request=Cannot restore: An active category with the same name already exists
api.category.restore.not.found=Deleted category not found with the specified ID
api.category.restore.param.id=Unique identifier of the deleted category to restore
api.category.restore.param.user.id=ID of the user restoring the category (optional, defaults to 1)

